name: ESLint Partner Autofix Test

on:
  pull_request:
    branches: ["main"]

jobs:
  eslint-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          npm init -y
          npm install eslint @microsoft/eslint-formatter-sarif --save-dev

      - name: Debug - List Files
        run: |
          ls -R

      - name: Run ESLint and Export SARIF
        run: |
          # 1. 確保安裝了必要的套件（新版 ESLint 需要這些）
          npm install eslint @microsoft/eslint-formatter-sarif @eslint/js --save-dev
          
          # 2. 執行掃描 (使用 . 代表掃描全域)
          # 注意：新版 ESLint 不需要 --format 的完整名稱，直接指定路徑或套件名
          npx eslint . --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif