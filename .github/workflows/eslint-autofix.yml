name: ESLint Partner Autofix Test

on:
  pull_request:
    branches: ["main"]

jobs:
  eslint-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          npm init -y
          npm install eslint @microsoft/eslint-formatter-sarif --save-dev

      - name: Debug - List Files
        run: |
          ls -R

      - name: Run ESLint and Export SARIF
        run: |
          # 直接掃描當前目錄 (.)，不要指定特定檔案
          npx eslint . --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif